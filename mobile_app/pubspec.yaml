name: water_level
description: Offline-first water level monitoring field application.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  firebase_core: ^3.13.0
  firebase_database: ^11.3.5
  firebase_auth: ^5.5.3
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  fl_chart: ^0.71.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  workmanager: 0.10.10
  collection: ^1.19.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true
  assets:
    - assets/sample_readings.json
